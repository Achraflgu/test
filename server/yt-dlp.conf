# yt-dlp Configuration File
# Bypasses YouTube bot detection and restrictions

# Use modern default client (auto-rotates, supports PO tokens) with fallbacks
--extractor-args "youtube:player_client=default,android,ios,web,mweb,tv"

# Realistic User-Agent
--user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"

# Delays between requests to avoid rate limiting
--sleep-requests 1
--sleep-interval 1
--max-sleep-interval 3

# Retry on network/stream errors
--retries 10
--fragment-retries 10
--retry-sleep 2

# Skip unavailable fragments
--skip-unavailable-fragments

# Parallel HLS downloads for speed
--concurrent-fragments 4

# Continue on minor non-fatal errors
--no-abort-on-error
--ignore-errors

# Disable unnecessary verbose warnings
--no-warnings

# Audio quality and format selection
--format "bestaudio/best"
--audio-format "mp3"
--audio-quality 0

# Embed cover metadata and tags
--embed-thumbnail
--embed-metadata
--add-metadata

