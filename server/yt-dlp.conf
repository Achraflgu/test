# yt-dlp Configuration File
# This fixes YouTube blocking issues without needing cookies

# Use Android client (YouTube blocks web clients more aggressively)
--extractor-args "youtube:player_client=android,web"

# Use realistic mobile user-agent
--user-agent "Mozilla/5.0 (Linux; Android 13; Pixel 7) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/116.0.0.0 Mobile Safari/537.36"

# Add delays between requests to avoid rate limiting
--sleep-requests 1
--sleep-interval 2
--max-sleep-interval 5

# Retry on errors (YouTube can be flaky)
--retries 10
--fragment-retries 10
--retry-sleep 3

# Skip unavailable fragments instead of failing
--skip-unavailable-fragments

# Continue on errors
--no-abort-on-error
--ignore-errors

# Better output for debugging
--print-to-file "%(title)s" -
--no-warnings

# Prefer better quality audio
--format "bestaudio/best"
--audio-format "mp3"
--audio-quality 0

# Embed metadata
--embed-thumbnail
--embed-metadata
--add-metadata

