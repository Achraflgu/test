# fly.toml configuration for track-miner-backend
app = "track-miner-backend"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3001"
  NODE_OPTIONS = "--max-old-space-size=1536"
  MAX_MEMORY_MB = "1800"
  MAX_PROCESSES = "20"
  MAX_DOWNLOADS = "15"
  CPU_THRESHOLD = "90"
  AUTO_UPDATE = "true"
  USE_FREE_PROXIES = "false"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 150
    hard_limit = 300

[[http_service.checks]]
  grace_period = "30s"
  interval = "15s"
  method = "GET"
  path = "/api/health"
  timeout = "5s"

[[vm]]
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 1
